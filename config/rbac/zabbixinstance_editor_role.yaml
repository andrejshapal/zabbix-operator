# This rule is not used by the project zabbix-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the zabbix.swisscom.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: zabbix-operator
    app.kubernetes.io/managed-by: kustomize
  name: zabbixinstance-editor-role
rules:
- apiGroups:
  - zabbix.swisscom.com
  resources:
  - zabbixinstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - zabbix.swisscom.com
  resources:
  - zabbixinstances/status
  verbs:
  - get
