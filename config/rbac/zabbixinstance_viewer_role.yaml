# This rule is not used by the project zabbix-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to zabbix.swisscom.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: zabbix-operator
    app.kubernetes.io/managed-by: kustomize
  name: zabbixinstance-viewer-role
rules:
- apiGroups:
  - zabbix.swisscom.com
  resources:
  - zabbixinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - zabbix.swisscom.com
  resources:
  - zabbixinstances/status
  verbs:
  - get
